<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INSTAR reporting tool</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"><div id="instar-splash" style="display:flex;height:100%;width:100%;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#3a3a3a;"><div style="max-width:30rem;padding:2rem;text-align:center;"><div style="font-size:1.05rem;font-weight:600;color:#2E5F8E;margin-bottom:0.6rem;">Starting R in your browser</div><p style="margin:0 0 0.8rem 0;line-height:1.5;">The first visit downloads about 35&nbsp;MB and takes roughly 30&nbsp;seconds. After that it loads from cache almost instantly.</p><p style="margin:0;font-size:0.9em;color:#6a6a6a;line-height:1.5;">The whole tool runs inside this tab, so nothing you type is sent to a server.</p></div></div></div>
    
  </body>
</html>
